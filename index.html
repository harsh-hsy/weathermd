<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather.md</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hidden SVG icon sprite. Used elsewhere with: <use href="#id"> -->
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="ic-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>
        </symbol>
        <symbol id="ic-moon" viewBox="0 0 24 24">
            <path d="M20.5 13.3A8.5 8.5 0 1 1 10.7 3.5a6.8 6.8 0 0 0 9.8 9.8z"/>
        </symbol>
        <symbol id="ic-cloud" viewBox="0 0 24 24">
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
        </symbol>
        <symbol id="ic-cloud-sun" viewBox="0 0 24 24">
            <circle cx="7" cy="7" r="2.5"/>
            <path d="M7 2v1.4M2 7h1.4M3.4 3.4l1 1M10.6 3.4l-1 1"/>
            <g transform="translate(4,4.5) scale(0.82)">
                <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
            </g>
        </symbol>
        <symbol id="ic-cloud-moon" viewBox="0 0 24 24">
            <path d="M10.8 2.8a4.7 4.7 0 0 0 3.1 6.9 3.8 3.8 0 0 1-5.9-4.6 4.7 4.7 0 0 1 2.8-2.3z"/>
            <g transform="translate(4,4.5) scale(0.82)">
                <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
            </g>
        </symbol>
        <symbol id="ic-rain" viewBox="0 0 24 24">
            <path d="M20 16.6A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>
            <path d="M8 14v4M12 15v4M16 14v4"/>
        </symbol>
        <symbol id="ic-drizzle" viewBox="0 0 24 24">
            <path d="M20 16.6A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>
            <path d="M8 15v2M12 16v2M16 15v2"/>
        </symbol>
        <symbol id="ic-thunder" viewBox="0 0 24 24">
            <path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/>
            <path d="M13 11l-3.5 6H15l-3.5 6"/>
        </symbol>
        <symbol id="ic-snow" viewBox="0 0 24 24">
            <path d="M20 17.6A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/>
            <path d="M8 16h.01M8 20h.01M12 18h.01M12 22h.01M16 16h.01M16 20h.01"/>
        </symbol>
        <symbol id="ic-fog" viewBox="0 0 24 24">
            <path d="M4 9h16M3 13h18M5 17h14"/>
        </symbol>
        <symbol id="ic-sunrise" viewBox="0 0 24 24">
            <path d="M17 18a5 5 0 0 0-10 0"/>
            <path d="M12 3v6M4.9 10.9l1.4 1.4M19.1 10.9l-1.4 1.4M2 18h2M20 18h2M2 22h20"/>
            <path d="M9 6l3-3 3 3"/>
        </symbol>
        <symbol id="ic-sunset" viewBox="0 0 24 24">
            <path d="M17 18a5 5 0 0 0-10 0"/>
            <path d="M12 9V3M4.9 10.9l1.4 1.4M19.1 10.9l-1.4 1.4M2 18h2M20 18h2M2 22h20"/>
            <path d="M9 6l3 3 3-3"/>
        </symbol>
        <symbol id="ic-pin" viewBox="0 0 24 24">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
        </symbol>
    </svg>

    <div class="container">

        <!-- HEADER -->
        <header>
            <h1>Weather.md</h1>
            <div class="search-section">
                <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off">
                <button id="searchBtn">Search</button>
            </div>
            <div class="header-actions">
                <button id="locationBtn" class="location-btn">
                    <span class="location-icon"><svg class="icon" aria-hidden="true"><use href="#ic-pin"></use></svg></span>
                    Current Location
                </button>
                <button id="themeBtn" class="theme-btn" aria-label="Toggle dark mode" title="Toggle theme">
                    <svg class="icon" aria-hidden="true"><use href="#ic-moon"></use></svg>
                </button>
            </div>
        </header>

        <div id="loading" class="hidden">Loading...</div>
        <div id="error" class="hidden"></div>

        <main class="dashboard">

            <!-- ROW 1 -->
            <section class="dashboard-row row-top">

                <!-- 1. Live Time + Date -->
                <div class="card">
                    <h2 class="card-title">Live Time &amp; Date</h2>
                    <div id="clock" class="clock-time">--:--:-- --</div>
                    <div id="date" class="clock-date">--</div>
                    <div id="timeIcon" class="time-icon"><svg class="icon" aria-hidden="true"><use href="#ic-sun"></use></svg></div>
                    <div id="timeLabel" class="time-label">Day</div>
                </div>

                <!-- 2. Today's Weather -->
                <div class="card">
                    <h2 class="card-title">Today's Weather</h2>
                    <h3 class="location">
                        <svg class="icon" aria-hidden="true"><use href="#ic-pin"></use></svg>
                        <span id="cityName">--</span>
                    </h3>

                    <div class="weather-main">
                        <div id="weatherIcon" class="weather-icon"><svg class="icon" aria-hidden="true"><use href="#ic-sun"></use></svg></div>
                        <div id="temperature" class="temperature">--</div>
                        <p id="condition" class="condition">--</p>
                    </div>

                    <div class="weather-details">
                        <div class="detail">
                            <span class="detail-label">Feels</span>
                            <span id="feelsLike" class="detail-value">--</span>
                        </div>
                        <div class="detail">
                            <span class="detail-label">High</span>
                            <span id="highTemp" class="detail-value">--</span>
                        </div>
                        <div class="detail">
                            <span class="detail-label">Low</span>
                            <span id="lowTemp" class="detail-value">--</span>
                        </div>
                        <div class="detail">
                            <span class="detail-label">Humidity</span>
                            <span id="humidity" class="detail-value">--</span>
                        </div>
                        <div class="detail">
                            <span class="detail-label">Wind</span>
                            <span id="windSpeed" class="detail-value">--</span>
                        </div>
                    </div>
                </div>

                <!-- 3. AQI + UV -->
                <div class="card aqi-card">
                    <h2 class="card-title">AQI &amp; UV</h2>

                    <div class="aqi-block">
                        <span class="aqi-label">AQI</span>
                        <span id="aqiValue" class="aqi-value">--</span>
                        <span id="aqiText" class="aqi-text">Search a city</span>
                    </div>

                    <div class="aqi-divider"></div>

                    <div class="uv-block">
                        <div class="uv-group">
                            <span id="uvValue" class="uv-value">--</span>
                            <span class="uv-text">Live</span>
                        </div>
                        <div class="uv-group">
                            <span id="uvMax" class="uv-value">--</span>
                            <span class="uv-text">High</span>
                        </div>
                    </div>
                </div>

            </section>

            <!-- ROW 2 -->
            <section class="dashboard-row row-bottom">

                <!-- 4. 6-Day Forecast -->
                <div class="card">
                    <h2 class="card-title">6-Day Forecast</h2>
                    <div id="forecastContainer" class="forecast-container">
                        <p class="placeholder-text">Search a city to see the forecast.</p>
                    </div>
                </div>

            </section>

            <!-- ROW 3 -->
            <section class="dashboard-row">

                <!-- 5. Other Cities -->
                <div class="card">
                    <h2 class="card-title">Other Cities</h2>
                    <div id="citiesContainer" class="cities-container">
                        <p class="placeholder-text">Loading cities...</p>
                    </div>
                </div>

            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
